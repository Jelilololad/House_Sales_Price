apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: lightgbm-sklearn-runtime
spec:
  supportedModelFormats:
    - name: lightgbm-sklearn
      version: "1"
      autoSelect: false
  protocolVersions:
    - v1
    - v2
  containers:
    - name: kserve-container
      image: ghcr.io/jelilololad/kserve-sklearn-lightgbm:latest
      args:
        - --model_name={{.Name}}
        - --model_dir=/mnt/models
        - --http_port=8080
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "1Gi"